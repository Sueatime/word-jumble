<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Jumble</title>
<meta name="color-scheme" content="dark">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Rubik+Doodle+Shadow&display=swap" rel="stylesheet">
<style>
:root{--h:260;--a:260;--bg:hsl(var(--h) 30% 9%);--panel:hsl(var(--h) 26% 15%);--ink:hsl(var(--h) 60% 95%);--mute:hsl(var(--h) 20% 68%);--pur:hsl(var(--a) 70% 68%);--key:hsl(var(--h) 14% 30%);--lite:hsl(var(--a) 95% 66%);--dark:hsl(var(--a) 60% 10%);--con:hsl(var(--a) 55% 45%);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;font-size:18px;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:24px 16px 40px;text-align:center}
h1{margin:0 0 8px;font-family:"Rubik Doodle Shadow","Outfit",system-ui,sans-serif;font-weight:400;font-size:clamp(30px,9.5vw,44px);letter-spacing:1px;line-height:1.1}
.sub{margin:0 0 16px;color:var(--mute);font-size:18px}
.q{background:var(--panel);border:2px solid var(--pur);border-radius:12px;padding:14px 16px;margin:0 0 18px}
.q b{display:block;font-size:20px;font-weight:600}
.q span{display:block;margin-top:4px;color:var(--mute);font-size:15px;line-height:1.4}
.rack,.tiles{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.rack{margin:0 0 22px}
.t{--ts:max(28px,min(52px,calc((min(100vw,480px) - 32px - (var(--n,6) - 1)*6px)/var(--n,6))));width:var(--ts);height:var(--ts);border-radius:8px;display:grid;place-items:center;font-size:min(22px,calc(var(--ts)*.5));font-weight:700;text-transform:uppercase}
.t.c{background:var(--con);color:#fff}
.t.v{background:var(--lite);color:var(--dark)}
.t.e{background:var(--key)}
.t.h{background:var(--lite);color:var(--dark);opacity:.55;font-weight:400}
.t.used{opacity:.3}
.t.good{background:var(--lite);color:var(--dark);font-weight:800}
.t.rev{background:hsl(var(--a) 25% 38%);color:var(--ink)}
.cell{position:relative}
.cell input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;font-size:16px;text-transform:uppercase;cursor:text}
.cell:focus-within .t.cur{outline:2px solid var(--pur);outline-offset:1px}
.tiles.wrong{animation:shake .4s}
.tiles.wrong .t{box-shadow:inset 0 0 0 2px hsl(0 85% 66%)}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.tiles.wrong{animation:none}}
.msg{min-height:26px;font-weight:600;margin:14px 0 10px}
.end{margin-top:16px;display:flex;gap:10px}
button{flex:1;font:inherit;font-weight:600;padding:10px 8px;border-radius:8px;border:2px solid var(--mute);background:transparent;color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.win{background:var(--pur);color:#fff;border-radius:10px;padding:12px;font-size:22px;font-weight:800;max-width:420px;margin:0 auto;animation:pop .5s ease-out;word-break:break-word}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.wh{font-size:.75em;opacity:.85;margin-bottom:4px;letter-spacing:1px;text-transform:uppercase}
.wl{margin-top:2px}
#wb .win{margin-bottom:18px}
@media (prefers-reduced-motion:reduce){.win{animation:none}}
@media (min-width:800px){
body{font-size:26px}
main{max-width:820px;padding-top:32px}
h1{font-size:66px;margin-bottom:12px}
.sub{font-size:25px}
.q b{font-size:28px}
.q span{font-size:21px}
.t{--ts:max(34px,min(68px,calc((min(100vw,820px) - 32px - (var(--n,6) - 1)*6px)/var(--n,6))));font-size:min(30px,calc(var(--ts)*.5))}
#msg{min-height:40px}
.end button{padding:14px 30px}
.win{font-size:30px;max-width:620px}
}
</style></head><body><main>
<h1>Word Jumble</h1>
<p class="sub">Rearrange the jumbled letters to spell a word.</p>
<div class="q"><b id="bt"></b></div>
<div id="wb"></div>
<div class="rack" id="rack" aria-label="Jumbled letters"></div>
<div class="cell"><div class="tiles" id="ans" aria-label="Your answer"></div><input id="g" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Type your answer"></div>
<div class="msg" id="msg" role="status"></div>
<div class="end"><button id="new">New game</button><button id="hint">Hint</button><button id="give">Give up</button></div>
</main>
<script>
const C={"Animals": "LION BEAR WOLF DEER FROG DUCK BIRD GOAT SEAL CRAB MOTH LAMB TOAD HAWK SWAN FISH HORSE SHEEP EAGLE SNAKE WHALE SHARK TIGER ZEBRA MOUSE PANDA KOALA OTTER CAMEL MONKEY RABBIT TURTLE PARROT SPIDER DOLPHIN PENGUIN GIRAFFE CHICKEN ELEPHANT KANGAROO BUTTERFLY CROCODILE HEDGEHOG SQUIRREL CATERPILLAR RHINOCEROS CHIMPANZEE FLAMINGO OCTOPUS PORCUPINE GRASSHOPPER ALLIGATOR HIPPOPOTAMUS", "Food": "CAKE MILK RICE SOUP CORN BEAN BACON BREAD PIZZA SALAD HONEY SUGAR CANDY TOAST LUNCH PASTA BUTTER CHEESE COFFEE NOODLE COOKIE DINNER BISCUIT MUFFIN SANDWICH PANCAKE SPAGHETTI CHOCOLATE HAMBURGER MARSHMALLOW DUMPLING OMELETTE CROISSANT PORRIDGE LASAGNA BREAKFAST", "Fruits & Veggies": "APPLE GRAPE LEMON BERRY MANGO PEACH PEAR PLUM LIME MELON OLIVE ONION ORANGE BANANA CHERRY CARROT POTATO TOMATO GARLIC PEPPER LETTUCE CABBAGE PINEAPPLE STRAWBERRY BLUEBERRY WATERMELON CUCUMBER BROCCOLI CAULIFLOWER AVOCADO CRANBERRY RASPBERRY PUMPKIN SPINACH COCONUT PAPAYA MUSHROOM EGGPLANT APRICOT POMEGRANATE TANGERINE", "Nature": "TREE MOON STAR RAIN WIND FIRE SAND SNOW WAVE LEAF LAKE HILL ROCK MIST DUST CLOUD RIVER STONE BEACH OCEAN STORM FIELD FLAME SMOKE PLANT LIGHT FOREST JUNGLE DESERT ISLAND VALLEY PLANET FLOWER THUNDER RAINBOW VOLCANO MOUNTAIN WATERFALL LIGHTNING HURRICANE EARTHQUAKE SUNSHINE SNOWFLAKE CONTINENT WILDERNESS PENINSULA ATMOSPHERE HORIZON GLACIER MEADOW CANYON", "Home & Objects": "LAMP DESK DOOR BELL RING TABLE CHAIR CLOCK BRUSH PAPER PHONE GLASS WINDOW PENCIL MIRROR BASKET CANDLE BOTTLE TICKET NEEDLE HAMMER JACKET POCKET BLANKET PICTURE MACHINE UMBRELLA FURNITURE REFRIGERATOR TELEVISION WARDROBE BOOKSHELF MATTRESS SCISSORS TOOTHBRUSH CALENDAR SUITCASE FLASHLIGHT NOTEBOOK SCREWDRIVER PILLOW CURTAIN", "Places": "HOME TOWN PARK FARM ROAD CITY HOUSE WORLD TOWER SCHOOL MARKET CASTLE BRIDGE LIBRARY KITCHEN GARDEN MUSEUM STREET CHURCH TEMPLE VILLAGE STATION AIRPORT APARTMENT UNIVERSITY RESTAURANT SUPERMARKET PLAYGROUND HOSPITAL LIGHTHOUSE SKYSCRAPER BOOKSTORE WAREHOUSE AQUARIUM STADIUM BAKERY THEATRE", "Body": "HAND FOOT HEAD NOSE BACK HAIR SKIN BRAIN HEART KNEE CHEEK THUMB TOOTH MOUTH WRIST ANKLE CHEST ELBOW FINGER SHOULDER STOMACH EYEBROW FOREHEAD KNUCKLE EYELASH FINGERNAIL BACKBONE HEARTBEAT HAMSTRING EYEBALL", "Colors": "BLUE PINK GOLD GREY GREEN BROWN BLACK WHITE YELLOW PURPLE SILVER VIOLET INDIGO CRIMSON SCARLET TURQUOISE MAGENTA BURGUNDY CHARCOAL EMERALD MAROON", "Fun & Music": "MUSIC PIANO DRUM SONG GAME KITE DANCE PAINT CHESS MOVIE PUZZLE GUITAR VIOLIN FLUTE TRUMPET BALLOON ORCHESTRA SAXOPHONE HARMONICA TRAMPOLINE CROSSWORD SKATEBOARD KARAOKE CARNIVAL FIREWORKS", "Transport": "BOAT SHIP TRAIN PLANE TRUCK BIKE TAXI TRAM ROCKET CANOE WAGON FERRY SUBWAY BICYCLE TRACTOR HELICOPTER MOTORCYCLE SUBMARINE AIRPLANE AMBULANCE SCOOTER LOCOMOTIVE SPACESHIP PARACHUTE HOVERCRAFT TRICYCLE", "People & Jobs": "KING QUEEN CHEF ACTOR JUDGE NURSE PILOT BAKER FRIEND FAMILY DOCTOR TEACHER CAPTAIN FARMER ARTIST SINGER DRIVER WRITER SAILOR LAWYER DENTIST PAINTER ENGINEER ASTRONAUT FIREFIGHTER ELECTRICIAN CARPENTER JOURNALIST ARCHITECT PHOTOGRAPHER PLUMBER MECHANIC SCIENTIST DETECTIVE GRANDMOTHER SHEPHERD PRESIDENT", "Fantasy": "MONSTER ROBOT GHOST ANGEL DRAGON WIZARD PIRATE PRINCE FAIRY GIANT UNICORN VAMPIRE WEREWOLF MERMAID DINOSAUR LEPRECHAUN SORCERER SUPERHERO SKELETON GOBLIN CENTAUR PHOENIX", "Time & Seasons": "SUMMER WINTER SPRING AUTUMN MORNING NIGHT HOLIDAY MONDAY FRIDAY SUNDAY TODAY NOON WEEK YEAR MONTH HOUR WEDNESDAY SATURDAY THURSDAY TUESDAY SEPTEMBER NOVEMBER DECEMBER YESTERDAY MIDNIGHT AFTERNOON SUNRISE SUNSET TOMORROW CENTURY JANUARY FEBRUARY OCTOBER EVENING", "Actions": "PLAY JUMP SWIM SING STEP LAUGH SMILE DREAM SLEEP WATCH WALK TALK READ WRITE LEARN THINK CLIMB SHOUT TRAVEL LISTEN JOURNEY WHISPER CELEBRATE REMEMBER IMAGINE DISCOVER EXPLORE WHISTLE ADVENTURE CHALLENGE", "Technology": "CODE DATA FILE LINK CHIP WIFI EMAIL VIDEO AUDIO PIXEL MODEM CABLE DRONE LAPTOP TABLET SCREEN MOBILE ONLINE SERVER CAMERA ROUTER SENSOR WEBSITE BROWSER PRINTER SPEAKER BATTERY KEYBOARD SOFTWARE INTERNET PASSWORD DOWNLOAD SMARTPHONE COMPUTER MICROPHONE ALGORITHM DATABASE BLUETOOTH PROGRAMMER HARDWARE WEBCAM TOUCHSCREEN", "Science": "ATOM CELL GENE ACID HEAT MASS LENS FORCE LASER ORBIT COMET VIRUS MAGNET PLASMA OXYGEN CARBON NEURON PROTON ENERGY GALAXY FOSSIL GRAVITY NEUTRON CRYSTAL MINERAL VACCINE MOLECULE ELECTRON EVOLUTION MICROSCOPE TELESCOPE EXPERIMENT LABORATORY BACTERIA RADIATION THERMOMETER HYPOTHESIS ASTEROID ECOSYSTEM CHROMOSOME SATELLITE CATALYST SPECTRUM", "School Subjects": "MATH LATIN DRAMA DESIGN ENGLISH HISTORY SCIENCE PHYSICS BIOLOGY GEOLOGY ALGEBRA GRAMMAR READING WRITING GEOGRAPHY CHEMISTRY MATHEMATICS LITERATURE ECONOMICS PSYCHOLOGY SOCIOLOGY GEOMETRY CALCULUS ASTRONOMY PHILOSOPHY ARITHMETIC TRIGONOMETRY STATISTICS ANTHROPOLOGY", "Countries": "PERU CUBA IRAN IRAQ OMAN MALI CHAD LAOS TOGO FIJI ITALY INDIA CHINA JAPAN SPAIN KENYA NEPAL EGYPT HAITI GHANA SUDAN SYRIA NIGER CHILE TONGA FRANCE BRAZIL CANADA MEXICO RUSSIA TURKEY GREECE POLAND NORWAY SWEDEN JORDAN CYPRUS MALTA UGANDA ZAMBIA GERMANY ENGLAND IRELAND AUSTRIA MOROCCO SOMALIA NIGERIA AUSTRALIA ARGENTINA INDONESIA MALAYSIA SINGAPORE PHILIPPINES SWITZERLAND NETHERLANDS PORTUGAL DENMARK FINLAND ICELAND BELGIUM UKRAINE VENEZUELA COLOMBIA ETHIOPIA TANZANIA THAILAND VIETNAM PAKISTAN AFGHANISTAN KAZAKHSTAN BANGLADESH MADAGASCAR", "Capital Cities": "PARIS ROME LIMA OSLO BERN DOHA RIGA SOFIA CAIRO TOKYO DELHI SEOUL HANOI QUITO MADRID LONDON BERLIN VIENNA ATHENS LISBON PRAGUE MOSCOW OTTAWA HAVANA MANILA TEHRAN ANKARA WARSAW DUBLIN BEIJING BAGHDAD BANGKOK NAIROBI WASHINGTON BUDAPEST HELSINKI COPENHAGEN AMSTERDAM BRUSSELS STOCKHOLM BUCHAREST ISLAMABAD KATHMANDU JAKARTA CANBERRA WELLINGTON BRASILIA MONTEVIDEO", "Sports": "GOLF JUDO YOGA POLO RUGBY SQUASH TENNIS HOCKEY CRICKET SOCCER BOXING SURFING ROWING SKIING CYCLING KARATE ARCHERY DIVING RACING BOWLING BASKETBALL VOLLEYBALL BADMINTON GYMNASTICS WRESTLING SWIMMING FOOTBALL BASEBALL SOFTBALL MARATHON SNOWBOARD FENCING ATHLETICS TRIATHLON HANDBALL CURLING", "Flowers": "ROSE LILY IRIS LOTUS TULIP DAISY PEONY POPPY ASTER PANSY LILAC ORCHID CROCUS DAHLIA CLOVER ZINNIA JASMINE PETUNIA BEGONIA SUNFLOWER DAFFODIL CARNATION LAVENDER MARIGOLD HYDRANGEA SNOWDROP BLUEBELL BUTTERCUP MAGNOLIA AZALEA HIBISCUS GERANIUM GARDENIA PRIMROSE SNAPDRAGON"};
const EXTRA="FLEA RATS ARTS PALM GRIN OWNS THING NOTES TONES ONSET BLEAT SLIME LIMES MILES CANOE PEST PETS STUD LEAK KALE BARE FLOW FOWL LUMP BANE REED MILE SORE REAP SNEAK EARTH HATER FILED CHEAP SHRUB WROTE DANGER GANDER RESTED FINDER FOWLER SIGN LOIN RIFE ICON ONES DARE DEAR BRAKE BREAK RESIGN SIGNER TOGA SALE MART ANGLE GLEAN SOUTH SILENT TINSEL ENLIST GENRE SLIVER MAIL PURE PAINS PANEL PENAL REIGN PAIRS MORE SOLO HASTEN ANIMAL COED LIFE BATTLE MOAT HATE SIGNED SINGED FLOG LOOP POOL CARING ARCING ORES RATES STARE TEARS MOAN TANGO";
const CAT={},ALL=[];for(const k in C)for(const w of C[k].split(" ")){CAT[w]=k;ALL.push(w)}
const VALID=new Set(ALL.concat(EXTRA.split(" ")));
const HUES=[0,20,35,45,95,125,150,205,225,245,260,280,300,320,340];
const $=i=>document.getElementById(i);
const shuf=a=>a.sort(()=>Math.random()-.5);
const isV=c=>"AEIOU".includes(c);
let deck=[],wd,tl,kn,typ,shown,gave,hints,order,pos,over,rid=0,last="",hue=-1;
const free=()=>wd.length-Object.keys(kn).length;
function layout(){let j=0,a=[];for(let i=0;i<wd.length;i++)a.push(kn[i]!==undefined?kn[i]:(j<typ.length?typ[j++]:"_"));return a}
function paint(){
const a=layout(),left={};a.forEach(c=>{if(c!=="_")left[c]=(left[c]||0)+1});
$("rack").innerHTML=tl.map(c=>{const u=left[c]>0;if(u)left[c]--;return `<div class="t ${isV(c)?"v":"c"} ${u?"used":""}">${c}</div>`}).join("");
const ci=a.indexOf("_");
$("ans").innerHTML=shown?[...shown].map(c=>`<div class="t ${gave?"rev":"good"}">${c}</div>`).join(""):
a.map((c,i)=>{const cu=i===ci?" cur":"";
if(c!=="_")return `<div class="t ${isV(c)?"v":"c"}">${c}</div>`;
return pos&&isV(wd[i])?`<div class="t h${cu}">?</div>`:`<div class="t e${cu}"></div>`}).join("")}
function start(){
rid++;over=false;gave=false;shown="";
let h;do{h=HUES[Math.random()*HUES.length|0]}while(h===hue);hue=h;
document.documentElement.style.setProperty("--a",h);
if(!deck.length)deck=shuf(ALL.slice());
wd=deck.pop();if(wd===last&&deck.length)wd=deck.pop();last=wd;
document.documentElement.style.setProperty("--n",wd.length);
kn={};typ="";hints=0;pos=false;
order=shuf([...wd].map((c,i)=>i).filter(i=>isV(wd[i])));
let l;do{l=shuf(wd.split(""))}while(l.join("")===wd||VALID.has(l.join("")));
tl=l;
$("bt").textContent="Category: "+CAT[wd];
$("wb").textContent="";$("msg").textContent="";$("msg").style.color="";
$("hint").disabled=false;$("give").disabled=false;
const g=$("g");g.value="";g.readOnly=false;g.maxLength=wd.length;
$("ans").classList.remove("wrong");paint();g.focus()}
function end(){over=true;$("hint").disabled=true;$("give").disabled=true;$("g").readOnly=true}
function isWord(f){return f.length===wd.length&&[...f].sort().join("")===[...wd].sort().join("")&&VALID.has(f)}
$("g").addEventListener("input",e=>{if(over)return;
typ=e.target.value.toUpperCase().replace(/[^A-Z]/g,"").slice(0,free());
e.target.value=typ;$("ans").classList.remove("wrong");paint();check()});
function check(){if(over||typ.length!==free())return;
const f=layout().join("");
if(isWord(f))solve(f);
else{const t=$("ans");void t.offsetWidth;t.classList.add("wrong");
$("msg").textContent=[...f].sort().join("")!==[...wd].sort().join("")?"Use exactly the letters shown above.":`"${f}" isn't a word. Try again!`}}
function solve(f,who){shown=f;end();paint();popup(nameOf(who),f);confetti()}
$("hint").onclick=()=>{if(over)return;const m=$("msg");
if(!pos){pos=true;m.textContent='Hint: the light "?" tiles show where the vowels are.';paint();$("g").focus();return}
if(hints>=order.length){m.textContent="No more vowels to reveal.";return}
const i=order[hints++];kn[i]=wd[i];typ=typ.slice(0,free());$("g").value=typ;
$("ans").classList.remove("wrong");m.textContent="Hint: a vowel is revealed.";paint();$("g").focus();check()};
$("give").onclick=()=>{if(over)return;end();gave=true;shown=wd;paint();$("msg").textContent="You gave up. The word was "+wd+"."};
$("new").onclick=start;
function nameOf(who){let nm=who||"";try{nm=nm||(new URLSearchParams(location.search).get("name")||window.playerName||"").trim().slice(0,30)}catch(e){}return nm||"Player"}
function popup(name,w){
const d=document.createElement("div");d.className="win";
const h=document.createElement("div");h.className="wh";h.textContent="Winner";d.appendChild(h);
const l=document.createElement("div");l.className="wl";l.textContent=name+" won with '"+w+"'";d.appendChild(l);
const m=$("wb");m.textContent="";m.appendChild(d);$("msg").textContent="";
const r=rid;setTimeout(()=>{if(over&&rid===r)start()},6000)}
function remote(word,name){if(over)return;word=String(word||"").trim().toUpperCase();if(!/^[A-Z]+$/.test(word))return;
if(isWord(word))solve(word,String(name||"").trim().slice(0,30))}
window.submitGuess=remote;
window.addEventListener("message",e=>{const d=e.data;if(d&&d.type==="guess")remote(d.word,d.name)});
document.addEventListener("keydown",e=>{if(!over&&document.activeElement!==$("g")&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&(/^[a-z]$/i.test(e.key)||e.key==="Backspace"))$("g").focus()});
const LIVE=/[?&]live=1/.test(location.search)||location.protocol==="file:";
function tikfinity(){let ws;try{ws=new WebSocket("ws://127.0.0.1:21213/")}catch(e){return}
ws.onmessage=ev=>{try{const m=JSON.parse(ev.data),d=m.data||m;if(!/chat|comment/i.test(String(m.event||m.type||"")))return;const u=d.user||{};remote(d.comment||d.text||d.message,d.nickname||d.uniqueId||u.nickname||u.uniqueId)}catch(e){}};
ws.onclose=()=>setTimeout(tikfinity,3000);ws.onerror=()=>ws.close()}
if(LIVE)tikfinity();
function confetti(){
if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10";c.width=innerWidth;c.height=innerHeight;document.body.append(c);
const x=c.getContext("2d"),cols=[0,45,150,200,260,320].map(h=>`hsl(${h} 85% 55%)`);
const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
let t=0;
(function f(){
x.clearRect(0,0,c.width,c.height);t++;
ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
if(t<160)requestAnimationFrame(f);else c.remove();
})();
}
start();
</script></body></html>
